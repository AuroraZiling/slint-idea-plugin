# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
# Resolve official origin URLs on Windows networks where the cache redirector fails TLS.
org.jetbrains.intellij.platform.useCacheRedirector = false

pluginRepositoryUrl = https://github.com/kizeevov/slint-idea-plugin

pluginGroup = dev.slint
pluginName = Slint
pluginVersion = 1.6.1-cargo.2
platformType = RR
platformVersion = 2026.2.1
pluginSinceBuild = 262
pluginUntilBuild = 262.*
platformPlugins =
pluginVerifierIdeVersions=2024.3,2025.1,2025.2,2025.3,2026.1,2026.2
jvmVersion = 21

slintLspVersion = 1.17.1
